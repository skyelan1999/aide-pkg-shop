name: Check public marketplace
on:
  pull_request:
  push:
    branches: ['release/**']
permissions:
  contents: read
concurrency:
  group: market-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node --check market.js
      - run: node scripts/test-routing-search.cjs
      - run: node scripts/test-commercial-display.cjs
      - run: python3 scripts/verify_catalog.py
